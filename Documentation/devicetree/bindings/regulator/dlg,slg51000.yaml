%YAML 1.2
---
$id: http://devicetree.org/schemas/regulator/dlg,slg51000.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Dialog Semiconductor SLG51000/SLG51002 Voltage Regulator

maintainers:
  - Eric Jeong <eric.jeong.opensource@diasemi.com>
  - Support Opensource <support.opensource@diasemi.com>

description: |
  The SLG51000 has seven LDOs; the SLG51002 has eight, and pairs LDO1 and LDO2
  on a shared input pin. The SLG51002 also has four GPIO outputs that boards
  use as load-switch enables; they are described as on/off regulators.

properties:
  compatible:
    enum:
      - dlg,slg51000
      - dlg,slg51002

  reg:
    maxItems: 1

  interrupts:
    maxItems: 1

  dlg,cs-gpios:
    maxItems: 1
    description:
      GPIO for chip select

  dlg,bb-gpios:
    maxItems: 1
    description:
      GPIO enabling the buck-boost converter that feeds the LDO inputs. It is
      raised before chip select.

  dlg,buck-gpios:
    maxItems: 1
    description:
      GPIO enabling the buck converter that feeds the LDO inputs. It is
      raised after dlg,bb-gpios and before chip select.

  vin1_2-supply:
    description:
      Input supply shared by ldo1 and ldo2, required if either is enabled

  vin3-supply:
    description:
      Input supply for ldo3, required if regulator is enabled

  vin4-supply:
    description:
      Input supply for ldo4, required if regulator is enabled

  vin5-supply:
    description:
      Input supply for ldo5, required if regulator is enabled

  vin6-supply:
    description:
      Input supply for ldo6, required if regulator is enabled

  vin7-supply:
    description:
      Input supply for ldo7, required if regulator is enabled

  vin8-supply:
    description:
      Input supply for ldo8, required if regulator is enabled

  regulators:
    type: object
    additionalProperties: false

    patternProperties:
      "^ldo[1-8]$":
        type: object
        $ref: /schemas/regulator/regulator.yaml#
        unevaluatedProperties: false

        properties:
          enable-gpios:
            maxItems: 1

        required:
          - regulator-name

      "^gpio[1-4]$":
        type: object
        $ref: /schemas/regulator/regulator.yaml#
        unevaluatedProperties: false
        description:
          GPIO output used as an on/off load-switch enable

        required:
          - regulator-name

required:
  - compatible
  - reg
  - regulators

allOf:
  - if:
      properties:
        compatible:
          const: dlg,slg51000
    then:
      properties:
        dlg,bb-gpios: false
        dlg,buck-gpios: false
        vin1_2-supply: false
        vin8-supply: false
        regulators:
          patternProperties:
            "^gpio[1-4]$": false
          properties:
            ldo8: false

additionalProperties: false

examples:
  - |
    #include <dt-bindings/gpio/gpio.h>
    #include <dt-bindings/interrupt-controller/irq.h>
    #include <dt-bindings/regulator/dlg,da9121-regulator.h>
    i2c {
        #address-cells = <1>;
        #size-cells = <0>;

        pmic@75 {
            compatible = "dlg,slg51000";
            reg = <0x75>;
            dlg,cs-gpios = <&tlmm 69 GPIO_ACTIVE_HIGH>;
            vin5-supply = <&vreg_s1f_1p2>;
            vin6-supply = <&vreg_s1f_1p2>;

            regulators {
                ldo1 {
                    regulator-name = "slg51000_b_ldo1";
                    regulator-min-microvolt = <2400000>;
                    regulator-max-microvolt = <3300000>;
                };

                ldo2 {
                    regulator-name = "slg51000_b_ldo2";
                    regulator-min-microvolt = <2400000>;
                    regulator-max-microvolt = <3300000>;
                };

                ldo3 {
                    regulator-name = "slg51000_b_ldo3";
                    regulator-min-microvolt = <1200000>;
                    regulator-max-microvolt = <3750000>;
                };

                ldo4 {
                    regulator-name = "slg51000_b_ldo4";
                    regulator-min-microvolt = <1200000>;
                    regulator-max-microvolt = <3750000>;
                };

                ldo5 {
                    regulator-name = "slg51000_b_ldo5";
                    regulator-min-microvolt = <500000>;
                    regulator-max-microvolt = <1200000>;
                };

                ldo6 {
                    regulator-name = "slg51000_b_ldo6";
                    regulator-min-microvolt = <500000>;
                    regulator-max-microvolt = <1200000>;
                };

                ldo7 {
                    regulator-name = "slg51000_b_ldo7";
                    regulator-min-microvolt = <1200000>;
                    regulator-max-microvolt = <3750000>;
                };
            };
        };
    };

  - |
    #include <dt-bindings/gpio/gpio.h>
    i2c {
        #address-cells = <1>;
        #size-cells = <0>;

        pmic@75 {
            compatible = "dlg,slg51002";
            reg = <0x75>;
            dlg,cs-gpios = <&pmic_gpio 0 GPIO_ACTIVE_HIGH>;
            dlg,bb-gpios = <&pmic_gpio 1 GPIO_ACTIVE_HIGH>;
            dlg,buck-gpios = <&pmic_gpio 3 GPIO_ACTIVE_HIGH>;

            regulators {
                ldo8 {
                    regulator-name = "cam_ldo8";
                    regulator-min-microvolt = <970000>;
                    regulator-max-microvolt = <970000>;
                };

                gpio3 {
                    regulator-name = "cam_gpio3";
                };
            };
        };
    };
